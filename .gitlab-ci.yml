# CI pipeline for gitlab-enhanced.
#
# Current executor: GitLab.com shared runners (Docker).
# Future executor:  self-hosted Incus runner (custom executor).
#
# Migration path — when the Incus runner is ready:
#   1. Build the CI base image: bash runtime/incus/images/build-ci-base.sh
#   2. Install executor scripts: sudo bash runtime/incus/runner/install.sh
#   3. Register the runner with tags: incus, self-hosted
#   4. Copy runtime/incus/runner/config.toml to /etc/gitlab-runner/config.toml
#   5. The `tags` and `INCUS_IMAGE` keys below route jobs to the Incus runner.
#      The `image:` keys are ignored by the Incus executor but kept as
#      documentation of the intended environment for shared-runner fallback.
#
# Triggers: every push to any branch, and all MR pipelines.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - secret-scan
  - lint
  - build
  - test
  - image

# ── Shared config ─────────────────────────────────────────────────────────────

.go-base:
  # image: used by shared runners (Docker executor).
  # The Incus executor ignores image: and uses INCUS_IMAGE instead.
  # Both point to equivalent environments: Go 1.25 + gotestsum + shellcheck + yamllint.
  image: golang:1.25-bookworm
  # tags: intentionally absent — jobs run on shared runners until an Incus runner
  # is registered. To migrate, uncomment the tags block and register a runner with
  # tags [incus, self-hosted]. See runtime/incus/runner/README.md.
  #
  # tags:
  #   - incus
  #   - self-hosted
  variables:
    # Incus executor: launch the pre-baked CI base image.
    # Built by: bash runtime/incus/images/build-ci-base.sh
    # Contains: Go 1.25, gitlab-runner-helper, gotestsum, shellcheck, yamllint
    INCUS_IMAGE: "gitlab-enhanced/ci-base:latest"
    # /go is the GOPATH in golang:1.25-bookworm (shared runners).
    # The Incus CI base image also sets GOPATH=/go for consistency.
    GOPATH: /go
    GOFLAGS: "-mod=readonly"
    CGO_ENABLED: "0"
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths:
      - /go/pkg/mod/
    policy: pull-push

# ── Lint stage ────────────────────────────────────────────────────────────────

go:vet:
  extends: .go-base
  stage: lint
  script:
    - go vet ./...

shellcheck:
  image: koalaman/shellcheck-alpine:stable
  stage: lint
  script:
    - shellcheck
        deploy/local/bootstrap.sh
        scripts/subtree-add-all.sh
        scripts/subtree-sync.sh
        .devcontainer/on-create.sh
        .devcontainer/post-start.sh
        runtime/incus/runner/config.sh
        runtime/incus/runner/prepare.sh
        runtime/incus/runner/run.sh
        runtime/incus/runner/cleanup.sh
        runtime/incus/runner/install.sh

yamllint:
  image: pipelinecomponents/yamllint:latest
  stage: lint
  script:
    # Lint all YAML files, excluding submodule/subtree directories and
    # generated files that we don't own.
    - |
      find . \( \
        -path './.git' \
        -o -path './vendor' \
        -o -path './node_modules' \
      \) -prune -o \( -name '*.yml' -o -name '*.yaml' \) -print \
      | xargs yamllint -c .yamllint.yaml

# ── Build stage ───────────────────────────────────────────────────────────────

go:build:
  extends: .go-base
  stage: build
  script:
    - mkdir -p bin
    - go build -v -o bin/gitlab-enhanced ./cmd/gitlab-enhanced/
    - go build -v ./...
  artifacts:
    paths:
      - bin/gitlab-enhanced
    expire_in: 1 week

# ── Image stage ───────────────────────────────────────────────────────────────
# Rebuilds the pre-baked CI base image on the self-hosted Incus runner.
# Triggered manually to control when Go / runner-helper versions are bumped.
#
# Run via: GitLab UI → Pipelines → Run pipeline → set REBUILD_CI_IMAGE=1
# Or:      gitlab-runner exec custom image:rebuild-ci-base (local test)

image:rebuild-ci-base:
  stage: image
  # This job requires incus on the host — it must run on the self-hosted runner.
  # Uncomment tags when the Incus runner is registered.
  # tags:
  #   - incus
  #   - self-hosted
  rules:
    # Only run when explicitly triggered — never on normal pushes or MRs.
    - if: $REBUILD_CI_IMAGE == "1"
      when: always
    - when: never
  variables:
    GO_VERSION: "1.25.0"
    RUNNER_VERSION: "17.11.0"
  script:
    - bash runtime/incus/images/build-ci-base.sh
    - incus image info gitlab-enhanced/ci-base:latest
  after_script:
    - echo "Image rebuilt. Export with:"
    - echo "  incus image export gitlab-enhanced/ci-base:latest ci-base.tar.gz"

image:rebuild-workspace:
  stage: image
  # Requires incus + buildctl on the self-hosted runner host.
  # Uncomment tags when the Incus runner is registered.
  # tags:
  #   - incus
  #   - self-hosted
  rules:
    # Auto-trigger when the workspace Dockerfile changes on main.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - runtime/incus/images/workspace/Dockerfile
        - runtime/incus/images/workspace/build.sh
      when: always
    # Manual trigger via REBUILD_WORKSPACE_IMAGE=1 on any branch.
    - if: $REBUILD_WORKSPACE_IMAGE == "1"
      when: always
    - when: never
  variables:
    GO_VERSION: "1.25.0"
    NODE_VERSION: "20"
    OPENVSCODE_VERSION: "1.89.1"
  script:
    - bash runtime/incus/images/workspace/build.sh
    - incus image info gitlab-enhanced/workspace-full:latest
  after_script:
    - echo "Workspace image rebuilt. Export with:"
    - echo "  incus image export gitlab-enhanced/workspace-full:latest workspace-full.tar.gz"

# ── Test stage ────────────────────────────────────────────────────────────────

go:test:
  extends: .go-base
  stage: test
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths:
      - /go/pkg/mod/
    policy: pull  # test only reads the cache; build already wrote it
  coverage: '/^coverage:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
  script:
    - go test -v -count=1 -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt
    - go tool cover -func=coverage.out | tail -1

secret-scan:
  stage: secret-scan
  image: python:3.12-slim
  before_script:
    - pip install git-filter-repo --quiet
  script:
    - |
      echo "Scanning commit history for leaked GitLab PATs..."
      git log --all -p | grep -E "glpat-[A-Za-z0-9_-]{20,}" && echo "LEAKED TOKEN DETECTED" && exit 1 || echo "No leaked tokens found."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master)$/'
