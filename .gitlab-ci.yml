# CI pipeline for gitlab-enhanced.
#
# Current executor: GitLab.com shared runners (Docker).
# Future executor:  self-hosted Incus runner (custom executor).
#
# Migration path — when the Incus runner is ready:
#   1. Build the CI base image: bash runtime/incus/images/build-ci-base.sh
#   2. Install executor scripts: sudo bash runtime/incus/runner/install.sh
#   3. Register the runner with tags: incus, self-hosted
#   4. Copy runtime/incus/runner/config.toml to /etc/gitlab-runner/config.toml
#   5. The `tags` and `INCUS_IMAGE` keys below route jobs to the Incus runner.
#      The `image:` keys are ignored by the Incus executor but kept as
#      documentation of the intended environment for shared-runner fallback.
#
# Triggers: every push to any branch, and all MR pipelines.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - secret-scan
  - lint
  - build
  - test
  - package
  - image

# ── Shared config ─────────────────────────────────────────────────────────────

.go-base:
  # image: used by shared runners (Docker executor).
  # The Incus executor ignores image: and uses INCUS_IMAGE instead.
  # Both point to equivalent environments: Go 1.25 + gotestsum + shellcheck + yamllint.
  image: golang:1.25-bookworm
  # tags: intentionally absent — jobs run on shared runners until an Incus runner
  # is registered. To migrate, uncomment the tags block and register a runner with
  # tags [incus, self-hosted]. See runtime/incus/runner/README.md.
  #
  # tags:
  #   - incus
  #   - self-hosted
  variables:
    # Incus executor: launch the pre-baked CI base image.
    # Built by: bash runtime/incus/images/build-ci-base.sh
    # Contains: Go 1.25, gitlab-runner-helper, gotestsum, shellcheck, yamllint
    INCUS_IMAGE: "gitlab-enhanced/ci-base:latest"
    # /go is the GOPATH in golang:1.25-bookworm (shared runners).
    # The Incus CI base image also sets GOPATH=/go for consistency.
    GOPATH: /go
    GOFLAGS: "-mod=readonly"
    # CGO_ENABLED=1 is required for the race detector (-race in go:test).
    # go:build sets it to 0 for a static binary; go:test overrides it to 1.
    CGO_ENABLED: "0"
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths:
      - /go/pkg/mod/
    policy: pull-push

# ── Lint stage ────────────────────────────────────────────────────────────────

go:vet:
  extends: .go-base
  stage: lint
  script:
    - go vet ./...

shellcheck:
  image: koalaman/shellcheck-alpine:stable
  stage: lint
  script:
    - shellcheck
        deploy/local/bootstrap.sh
        scripts/subtree-add-all.sh
        scripts/subtree-sync.sh
        .devcontainer/on-create.sh
        .devcontainer/post-start.sh
        runtime/incus/runner/config.sh
        runtime/incus/runner/prepare.sh
        runtime/incus/runner/run.sh
        runtime/incus/runner/cleanup.sh
        runtime/incus/runner/install.sh

yamllint:
  image: pipelinecomponents/yamllint:latest
  stage: lint
  script:
    # Lint all YAML files, excluding submodule/subtree directories and
    # generated files that we don't own.
    - |
      find . \( \
        -path './.git' \
        -o -path './vendor' \
        -o -path './node_modules' \
        -o -path './environments/workspace-images' \
        -o -path './environments/supervisor' \
        -o -path './environments/content-service' \
        -o -path './environments/openvscode-server' \
        -o -path './environments/browser-extension' \
        -o -path './environments/adapters' \
        -o -path './lfs/server' \
        -o -path './lfs/transfer' \
        -o -path './lfs/adapters' \
        -o -path './ipfs/brig' \
        -o -path './hosting/soft-serve' \
        -o -path './hosting/soft-serve-action' \
        -o -path './runtime/blincus' \
        -o -path './runtime/k8s-in-incus' \
        -o -path './core/omnibus' \
        -o -path './core/environment-toolkit' \
        -o -path './utils/github-directory-downloader' \
        -o -path './utils/github-parser' \
        -o -path './utils/gitpack' \
      \) -prune -o \( -name '*.yml' -o -name '*.yaml' \) -print \
      | xargs yamllint -c .yamllint.yaml

# ── Build stage ───────────────────────────────────────────────────────────────

go:build:
  extends: .go-base
  stage: build
  script:
    - mkdir -p bin
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA:-dev}}"
      COMMIT="${CI_COMMIT_SHORT_SHA:-unknown}"
      DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      MODULE="gitlab.com/openos-project/git-management_deving/gitlab-enhanced"
      LDFLAGS="-s -w
        -X ${MODULE}/version.Version=${VERSION}
        -X ${MODULE}/version.Commit=${COMMIT}
        -X ${MODULE}/version.Date=${DATE}"
      go build -v -ldflags "${LDFLAGS}" -o bin/gitlab-enhanced ./cmd/gitlab-enhanced/
    - go build -v ./...
  artifacts:
    paths:
      - bin/gitlab-enhanced
    expire_in: 1 week

# ── Package stage ─────────────────────────────────────────────────────────────
# Builds .deb and .rpm packages using nfpm.
# Runs automatically on version tags (v*) and can be triggered manually.
# The binary artifact from go:build is reused — no recompilation needed.

package:nfpm:
  stage: package
  image: golang:1.25-bookworm
  needs:
    - job: go:build
      artifacts: true
  rules:
    # Always run on version tags
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
      when: always
    # Manual trigger on any branch (for testing packaging)
    - if: '$BUILD_PACKAGES == "1"'
      when: always
    - when: never
  variables:
    NFPM_VERSION: "2.41.1"
  before_script:
    - |
      # Install nfpm
      curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
        | tar -xz -C /usr/local/bin nfpm
      nfpm --version
  script:
    - mkdir -p dist
    - |
      # Derive version: prefer tag, fall back to short SHA
      PKG_VERSION="${CI_COMMIT_TAG#v}"
      PKG_VERSION="${PKG_VERSION:-${CI_COMMIT_SHORT_SHA:-0.0.0-dev}}"
      echo "Packaging version: ${PKG_VERSION}"
      # nfpm reads VERSION from the environment
      VERSION="${PKG_VERSION}" nfpm package \
        --config packaging/config/nfpm.yaml \
        --packager deb \
        --target dist/
      VERSION="${PKG_VERSION}" nfpm package \
        --config packaging/config/nfpm.yaml \
        --packager rpm \
        --target dist/
      ls -lh dist/
  artifacts:
    name: "gitlab-enhanced-packages-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/*.deb
      - dist/*.rpm
    expire_in: 4 weeks

# ── Image stage ───────────────────────────────────────────────────────────────
# Rebuilds the pre-baked CI base image on the self-hosted Incus runner.
# Triggered manually to control when Go / runner-helper versions are bumped.
#
# Run via: GitLab UI → Pipelines → Run pipeline → set REBUILD_CI_IMAGE=1
# Or:      gitlab-runner exec custom image:rebuild-ci-base (local test)

image:rebuild-ci-base:
  stage: image
  # This job requires incus on the host — it must run on the self-hosted runner.
  # Uncomment tags when the Incus runner is registered.
  # tags:
  #   - incus
  #   - self-hosted
  rules:
    # Only run when explicitly triggered — never on normal pushes or MRs.
    - if: $REBUILD_CI_IMAGE == "1"
      when: always
    - when: never
  variables:
    GO_VERSION: "1.25.0"
    RUNNER_VERSION: "17.11.0"
  script:
    - bash runtime/incus/images/build-ci-base.sh
    - incus image info gitlab-enhanced/ci-base:latest
  after_script:
    - echo "Image rebuilt. Export with:"
    - echo "  incus image export gitlab-enhanced/ci-base:latest ci-base.tar.gz"

image:rebuild-workspace:
  stage: image
  # Requires incus + buildctl on the self-hosted runner host.
  # Uncomment tags when the Incus runner is registered.
  # tags:
  #   - incus
  #   - self-hosted
  rules:
    # Auto-trigger when the workspace Dockerfile changes on main.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - runtime/incus/images/workspace/Dockerfile
        - runtime/incus/images/workspace/build.sh
      when: always
    # Manual trigger via REBUILD_WORKSPACE_IMAGE=1 on any branch.
    - if: $REBUILD_WORKSPACE_IMAGE == "1"
      when: always
    - when: never
  variables:
    GO_VERSION: "1.25.0"
    NODE_VERSION: "20"
    OPENVSCODE_VERSION: "1.89.1"
  script:
    - bash runtime/incus/images/workspace/build.sh
    - incus image info gitlab-enhanced/workspace-full:latest
  after_script:
    - echo "Workspace image rebuilt. Export with:"
    - echo "  incus image export gitlab-enhanced/workspace-full:latest workspace-full.tar.gz"

# ── Test stage ────────────────────────────────────────────────────────────────

go:test:
  extends: .go-base
  stage: test
  needs:
    - job: go:build
      artifacts: false
  variables:
    # Enable the race detector. Requires CGO.
    CGO_ENABLED: "1"
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths:
      - /go/pkg/mod/
    policy: pull  # test only reads the cache; build already wrote it
  coverage: '/^coverage:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
  script:
    - go test -race -v -count=1 -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt
    - go tool cover -func=coverage.out | tail -1

secret-scan:
  stage: secret-scan
  image: python:3.12-slim
  script:
    - |
      echo "Scanning commit history for leaked secrets..."
      FOUND=0

      # GitLab PATs
      if git log --all -p | grep -qE "glpat-[A-Za-z0-9_-]{20,}"; then
        echo "ERROR: GitLab PAT detected in history"
        FOUND=1
      fi

      # AWS access key IDs (AKIA…)
      if git log --all -p | grep -qE "AKIA[0-9A-Z]{16}"; then
        echo "ERROR: AWS access key ID detected in history"
        FOUND=1
      fi

      # AWS secret access keys (40-char base64 after common key names)
      if git log --all -p | grep -qiE "(aws_secret_access_key|aws_secret_key)\s*[=:]\s*[A-Za-z0-9/+]{40}"; then
        echo "ERROR: AWS secret access key detected in history"
        FOUND=1
      fi

      # Ethereum / secp256k1 private keys (64 hex chars after common field names)
      if git log --all -p | grep -qiE "(eth_private_key|private_key|privatekey)\s*[=:\"']+\s*[0-9a-fA-F]{64}"; then
        echo "ERROR: Hex private key detected in history"
        FOUND=1
      fi

      # Generic high-entropy bearer tokens / API keys
      if git log --all -p | grep -qiE "(api_key|api_secret|auth_token|bearer)\s*[=:\"']+\s*[A-Za-z0-9_\-]{32,}"; then
        echo "ERROR: Generic API key/token detected in history"
        FOUND=1
      fi

      if [ "$FOUND" -eq 1 ]; then
        echo "Secret scan FAILED — review the matches above and rotate any exposed credentials."
        exit 1
      fi
      echo "Secret scan passed — no known secret patterns found."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master)$/'
