# CI pipeline for gitlab-enhanced.
#
# Current executor: GitLab.com shared runners (Docker).
# Future executor:  self-hosted Incus runner (custom executor).
#
# Migration path — when the Incus runner is ready:
#   1. Run: sudo bash runtime/incus/runner/install.sh   (on the runner host)
#   2. Register the runner with tags: incus, self-hosted
#   3. Copy runtime/incus/runner/config.toml to /etc/gitlab-runner/config.toml
#   4. The `tags` key below already routes tagged jobs to the Incus runner.
#      The `image:` keys are ignored by the Incus executor but kept as
#      documentation of the intended environment.
#
# Triggers: every push to any branch, and all MR pipelines.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - lint
  - build
  - test

# ── Shared config ─────────────────────────────────────────────────────────────

.go-base:
  # image: used by shared runners; ignored by the Incus executor.
  # The Incus executor uses INCUS_IMAGE (default: ubuntu:24.04) with Go
  # pre-installed via cloud-init or a custom image.
  image: golang:1.24-bookworm
  tags:
    - incus        # routes to self-hosted Incus runner when registered
    - self-hosted  # falls back to shared runners when no Incus runner is available
  variables:
    GOPATH: /go
    GOFLAGS: "-mod=readonly"
    CGO_ENABLED: "0"
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths:
      - /go/pkg/mod/
    policy: pull-push

# ── Lint stage ────────────────────────────────────────────────────────────────

go:vet:
  extends: .go-base
  stage: lint
  script:
    - go vet ./...

shellcheck:
  image: koalaman/shellcheck-alpine:stable
  tags:
    - incus
    - self-hosted
  stage: lint
  script:
    - shellcheck
        deploy/local/bootstrap.sh
        scripts/subtree-add-all.sh
        scripts/subtree-sync.sh
        .devcontainer/on-create.sh
        .devcontainer/post-start.sh
        runtime/incus/runner/config.sh
        runtime/incus/runner/prepare.sh
        runtime/incus/runner/run.sh
        runtime/incus/runner/cleanup.sh
        runtime/incus/runner/install.sh

yamllint:
  image: pipelinecomponents/yamllint:latest
  tags:
    - incus
    - self-hosted
  stage: lint
  script:
    # Lint all YAML files, excluding submodule/subtree directories and
    # generated files that we don't own.
    - |
      find . \( \
        -path './.git' \
        -o -path './vendor' \
        -o -path './node_modules' \
      \) -prune -o \( -name '*.yml' -o -name '*.yaml' \) -print \
      | xargs yamllint -c .yamllint.yaml

# ── Build stage ───────────────────────────────────────────────────────────────

go:build:
  extends: .go-base
  stage: build
  script:
    - mkdir -p bin
    - go build -v -o bin/gitlab-enhanced ./cmd/gitlab-enhanced/
    - go build -v ./...
  artifacts:
    paths:
      - bin/gitlab-enhanced
    expire_in: 1 week

# ── Test stage ────────────────────────────────────────────────────────────────

go:test:
  extends: .go-base
  stage: test
  variables:
    GOFLAGS: ""   # allow go install to fetch gotestsum
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths:
      - /go/pkg/mod/
    policy: pull          # test only reads the cache, build already wrote it
  coverage: '/^coverage:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      junit: report.xml
    expire_in: 1 week
  before_script:
    - go install gotest.tools/gotestsum@latest
  script:
    - gotestsum --junitfile report.xml --format testname -- -race -count=1 -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
