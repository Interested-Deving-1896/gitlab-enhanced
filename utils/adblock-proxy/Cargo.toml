[package]
name = "adblock-proxy"
version = "0.1.0"
edition = "2021"
description = "HTTP sidecar exposing adblock-rust network filtering for gitlab-enhanced"
license = "MPL-2.0"

[[bin]]
name = "adblock-proxy"
path = "src/main.rs"

[dependencies]
adblock = { version = "0.12", features = ["resource-assembler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
