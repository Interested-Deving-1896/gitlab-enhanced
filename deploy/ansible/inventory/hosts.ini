# gitlab-enhanced Ansible inventory
#
# All playbooks in deploy/ansible/ run against localhost using
# connection: local — they drive Incus via the CLI, not SSH.
#
# To target a remote host (e.g. a dedicated runner machine), add it here:
#   [runner_hosts]
#   runner.example.com ansible_user=ubuntu

[local]
localhost ansible_connection=local

[all:vars]
ansible_python_interpreter=/usr/bin/python3
