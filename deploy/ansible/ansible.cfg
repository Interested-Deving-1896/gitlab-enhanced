[defaults]
# Inventory — localhost only; all playbooks use connection: local
inventory          = inventory/hosts.ini

# Keep output readable
stdout_callback    = yaml
stderr_callback    = yaml

# Don't create .retry files
retry_files_enabled = false

# Speed up fact gathering (not needed for localhost plays)
gathering          = smart
fact_caching       = memory

# Roles path — include the k8s-in-incus roles
roles_path         = ../../runtime/k8s-in-incus/ansible/roles

# SSH settings (used when targeting remote hosts in future)
[ssh_connection]
pipelining         = true
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
