---
# Installs kubeadm, kubelet, and kubectl inside an Incus VM.
# Also applies required kernel/network settings for Kubernetes.

- name: Apply required kernel modules
  ansible.builtin.command: >
    incus exec {{ incus_vm_name }} -- bash -c "
      cat <<EOF > /etc/modules-load.d/k8s.conf
overlay
br_netfilter
EOF
      modprobe overlay
      modprobe br_netfilter
    "
  changed_when: true

- name: Apply required sysctl settings
  ansible.builtin.command: >
    incus exec {{ incus_vm_name }} -- bash -c "
      cat <<EOF > /etc/sysctl.d/k8s.conf
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward                 = 1
EOF
      sysctl --system
    "
  changed_when: true

- name: Disable swap
  ansible.builtin.command: >
    incus exec {{ incus_vm_name }} -- bash -c "
      swapoff -a &&
      sed -i '/swap/d' /etc/fstab
    "
  changed_when: true

- name: Add Kubernetes apt repository
  ansible.builtin.command: >
    incus exec {{ incus_vm_name }} -- bash -c "
      apt-get install -y apt-transport-https ca-certificates curl gpg &&
      mkdir -p /etc/apt/keyrings &&
      curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ k8s_repo_version }}/deb/Release.key |
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg &&
      echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
        https://pkgs.k8s.io/core:/stable:/{{ k8s_repo_version }}/deb/ /' >
        /etc/apt/sources.list.d/kubernetes.list &&
      apt-get update -qq
    "
  changed_when: true

- name: Install kubeadm, kubelet, kubectl
  ansible.builtin.command: >
    incus exec {{ incus_vm_name }} -- bash -c "
      apt-get install -y
        kubeadm={{ k8s_kubeadm_version }}
        kubelet={{ k8s_kubelet_version }}
        {% if k8s_install_kubectl %}kubectl={{ k8s_kubectl_version }}{% endif %}
      apt-mark hold kubeadm kubelet {% if k8s_install_kubectl %}kubectl{% endif %}
    "
  changed_when: true

- name: Enable kubelet
  ansible.builtin.command: >
    incus exec {{ incus_vm_name }} -- systemctl enable kubelet
  changed_when: true
