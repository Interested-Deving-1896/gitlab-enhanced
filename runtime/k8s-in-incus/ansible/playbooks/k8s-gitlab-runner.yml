---
# Installs GitLab Runner with the Kubernetes executor on the local K8s cluster.
# Runners register against the GitLab instance deployed by core/omnibus.
#
# Prerequisites:
#   ansible-playbook runtime/k8s-in-incus/ansible/playbooks/k8s-cluster.yml
#
# Usage:
#   ansible-playbook runtime/k8s-in-incus/ansible/playbooks/k8s-gitlab-runner.yml \
#     -e gitlab_url=https://gitlab.local \
#     -e gitlab_runner_token=glrt-xxxxxxxxxxxx

- name: Install GitLab Runner via Helm
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Install Helm on control plane
      ansible.builtin.command: >
        incus exec control-plane -- bash -c "
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        "
      changed_when: true

    - name: Add GitLab Helm repository
      ansible.builtin.command: >
        incus exec control-plane -- helm repo add gitlab https://charts.gitlab.io &&
        incus exec control-plane -- helm repo update
      changed_when: true

    - name: Create runner namespace
      ansible.builtin.command: >
        incus exec control-plane -- kubectl create namespace gitlab-runner
      changed_when: true
      failed_when: false

    - name: Install GitLab Runner chart
      ansible.builtin.command: >
        incus exec control-plane -- helm upgrade --install gitlab-runner gitlab/gitlab-runner
          --namespace gitlab-runner
          --set gitlabUrl={{ gitlab_url }}
          --set runnerToken={{ gitlab_runner_token }}
          --set rbac.create=true
          --set runners.executor=kubernetes
          --set runners.kubernetes.namespace=gitlab-runner
          --set runners.kubernetes.image={{ gitlab_runner_default_image }}
          --set concurrent={{ gitlab_runner_concurrent }}
      changed_when: true

    - name: Wait for runner deployment
      ansible.builtin.command: >
        incus exec control-plane -- kubectl rollout status deployment/gitlab-runner
          -n gitlab-runner --timeout=120s
      changed_when: false

    - name: Verify runner registered
      ansible.builtin.debug:
        msg: >
          GitLab Runner registered at {{ gitlab_url }}.
          Check runners at {{ gitlab_url }}/admin/runners
