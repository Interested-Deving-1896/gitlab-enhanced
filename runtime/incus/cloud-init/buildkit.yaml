#cloud-config
# Cloud-init user-data for the BuildKit Incus VM.
# Applied on first boot when the VM is launched by abstraction/build/incus.go.
# Installs buildkitd and enables it as a systemd service.
#
# To update the BuildKit version, change BUILDKIT_VERSION below and rebuild
# the VM: incus delete buildkit --force && gitlab-enhanced up

packages:
  - apt-transport-https
  - ca-certificates
  - curl

runcmd:
  - |
    set -euo pipefail
    BUILDKIT_VERSION=v0.15.1
    ARCH=$(uname -m)
    case "$ARCH" in
      x86_64)  BUILDKIT_ARCH=amd64 ;;
      aarch64) BUILDKIT_ARCH=arm64 ;;
      *)       echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
    esac
    curl -fsSL \
      "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-${BUILDKIT_ARCH}.tar.gz" \
      | tar -xz -C /usr/local
    cat > /etc/systemd/system/buildkitd.service <<'EOF'
    [Unit]
    Description=BuildKit daemon
    After=network.target

    [Service]
    ExecStart=/usr/local/bin/buildkitd --root /var/cache/buildkit
    Restart=always
    RestartSec=5
    StandardOutput=journal
    StandardError=journal

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable buildkitd
    systemctl start buildkitd
