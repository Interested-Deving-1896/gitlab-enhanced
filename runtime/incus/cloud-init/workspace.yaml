#cloud-config
# Cloud-init user-data for workspace containers.
# Applied when a workspace container is first created by
# abstraction/environment/incus.go. Installs common development tools
# that are not baked into the workspace image.
#
# This file is a reference/fallback. The workspace image
# (runtime/incus/images/workspace/Dockerfile) should pre-install
# everything needed so cloud-init is a no-op for most containers.

package_update: true
package_upgrade: false

packages:
  - git
  - git-lfs
  - curl
  - wget
  - jq
  - unzip
  - build-essential
  - ca-certificates
  - sudo
  - locales

locale: en_US.UTF-8
timezone: UTC

users:
  - name: gitpod
    gecos: "Workspace User"
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo, docker]

runcmd:
  - git lfs install --system
  - locale-gen en_US.UTF-8
  - update-locale LANG=en_US.UTF-8
